<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pakein — Offline Products Editor</title>
<style>
  :root{--pink:#ec4899;--rose:#fdf2f8;--gray:#6b7280}
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial}
  body{margin:0;background:#fff}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #fde2e8}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  h1{margin:0;font-size:20px;color:#1f2937}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px}
  .badge{font-size:12px;color:#9ca3af}
  .btn{border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;background:#fff;cursor:pointer}
  .btn:hover{background:#f9fafb}
  .btn-primary{background:linear-gradient(135deg,#ec4899,#f472b6);border:none;color:#fff}
  .btn-primary:hover{filter:brightness(.95)}
  .btn-danger{border-color:#fecaca;color:#b91c1c;background:#fff5f5}
  .chip{font-size:12px;border-radius:999px;background:#fce7f3;color:#9d174d;padding:2px 8px}
  .row{display:grid;grid-template-columns:80px 1fr 120px 120px 140px 80px 120px 150px;gap:8px;align-items:center}
  .thead{background:#fdf2f8;border:1px solid #fde2e8;border-radius:12px 12px 0 0;padding:10px 12px;font-weight:600;font-size:13px}
  .tbody{border:1px solid #fde2e8;border-top:none;border-radius:0 0 12px 12px;padding:8px 8px}
  .card{border:1px solid #e5e7eb;border-radius:14px;padding:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{font-size:12px;color:#374151;margin-bottom:4px;display:block}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px}
  textarea{resize:vertical}
  .muted{color:#6b7280;font-size:12px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .search{flex:1;min-width:220px}
  .pill{background:#f3f4f6;border-radius:999px;padding:4px 10px;font-size:12px;color:#374151}
  .empty{padding:40px 0;text-align:center;color:#6b7280}
  .no-wrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <h1>Pakein — Offline Products Editor</h1>
      <div class="badge">Edit <code>data/products.json</code> tanpa server</div>
    </div>
    <div class="toolbar">
      <input id="search" class="search" placeholder="Cari nama / material…" />
      <label class="pill">
        <input id="openFile" type="file" accept="application/json" style="display:none">
        <button class="btn" id="openBtn">Open JSON</button>
      </label>
      <button class="btn" id="addBtn">+ Produk</button>
      <button class="btn btn-primary" id="exportBtn">Export JSON</button>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:16px;padding-bottom:50px">
  <div class="thead row">
    <div>ID</div><div>Nama</div><div>Harga</div><div>Style</div>
    <div>Material</div><div>Stok</div><div>Flags</div><div class="no-wrap">Aksi</div>
  </div>
  <div class="tbody" id="tableBody"></div>

  <!-- Editor -->
  <div id="editor" class="card" style="margin-top:16px;display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <strong id="edTitle">Produk</strong>
      <div class="muted">Pastikan JSON valid untuk Sizes & Photos</div>
    </div>
    <div class="grid">
      <div>
        <label>Nama</label><input id="fName">
      </div>
      <div>
        <label>Harga (angka)</label><input id="fPrice" type="number" min="0">
      </div>
      <div>
        <label>Style</label>
        <select id="fStyle">
          <option>classic</option><option>oversized</option><option>lightweight</option>
          <option>cropped</option><option>long</option><option>button-up</option>
        </select>
      </div>
      <div>
        <label>Thickness</label>
        <select id="fThickness">
          <option>thin</option><option selected>medium</option><option>thick</option>
        </select>
      </div>
      <div>
        <label>Material</label><input id="fMaterial">
      </div>
      <div>
        <label>Occasion (pisah koma)</label><input id="fOccasion" placeholder="casual,work">
      </div>
      <div>
        <label>Shopee URL</label><input id="fShopee">
      </div>
      <div style="display:flex;gap:16px;align-items:center;margin-top:24px">
        <label><input id="fFeatured" type="checkbox"> Featured</label>
        <label><input id="fTrending" type="checkbox"> Trending</label>
      </div>

      <div style="grid-column:1/-1">
        <label>Deskripsi</label><textarea id="fDesc" rows="2"></textarea>
      </div>
      <div style="grid-column:1/-1">
        <label>Care Instructions</label><input id="fCare">
      </div>

      <div style="grid-column:1/-1">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <label>Sizes (JSON)</label>
          <button class="btn" id="sizesEx">Contoh</button>
        </div>
        <textarea id="fSizes" rows="5" class="mono" placeholder='[{"size":"All Size","bust":"84-106","length":"58-64","available":true,"stock":10,"note":"..."}]'></textarea>
      </div>

      <div style="grid-column:1/-1">
        <label>Styling Tips (pisah baris)</label>
        <textarea id="fTips" rows="3" class="mono" placeholder="Tip 1&#10;Tip 2"></textarea>
      </div>

      <div style="grid-column:1/-1">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <label>Photos (JSON)</label>
          <button class="btn" id="photosEx">Contoh</button>
        </div>
        <textarea id="fPhotos" rows="5" class="mono" placeholder='[{"url":"https://...","label":"Tampak Depan"}]'></textarea>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" id="cancelEdit">Batal</button>
      <button class="btn btn-primary" id="saveEdit">Simpan Perubahan</button>
    </div>
  </div>

  <div id="empty" class="empty">Belum ada data. Klik <strong>Open JSON</strong> untuk memuat, atau <strong>+ Produk</strong> untuk mulai dari kosong.</div>
</main>

<script>
(function(){
  const state = {
    list: [],
    filtered: [],
    editIndex: -1
  };

  const $ = id => document.getElementById(id);
  const render = () => {
    const body = $('tableBody');
    const data = state.filtered.length ? state.filtered : state.list;
    body.innerHTML = '';

    if (!data.length) {
      $('empty').style.display = 'block';
      return;
    }
    $('empty').style.display = 'none';

    data.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.padding = '8px';
      row.style.alignItems = 'center';
      row.style.borderRadius = '8px';

      const flags = [];
      if (p.featured) flags.push('featured');
      if (p.trending) flags.push('trending');

      row.innerHTML = `
        <div>${p.id ?? ''}</div>
        <div class="no-wrap" title="${p.name||''}">${p.name||''}</div>
        <div>Rp ${(p.price||0).toLocaleString('id-ID')}</div>
        <div><span class="chip">${p.style||''}</span></div>
        <div class="no-wrap" title="${p.material||''}">${p.material||''}</div>
        <div>${(p.sizes?.[0]?.stock ?? 0)}</div>
        <div>${flags.map(f=>`<span class="chip">${f}</span>`).join(' ')}</div>
        <div class="no-wrap">
          <button class="btn" data-act="edit" data-idx="${idx}">Edit</button>
          <button class="btn btn-danger" data-act="del" data-idx="${idx}">Hapus</button>
        </div>
      `;
      body.appendChild(row);
    });
  };

  const openEditor = (p, index) => {
    state.editIndex = index;
    $('edTitle').textContent = index === -1 ? 'Tambah Produk' : ('Edit Produk #' + (p.id ?? ''));
    $('editor').style.display = 'block';

    $('fName').value = p.name || '';
    $('fPrice').value = p.price || 0;
    $('fStyle').value = p.style || 'classic';
    $('fThickness').value = p.thickness || 'medium';
    $('fMaterial').value = p.material || '';
    $('fOccasion').value = (p.occasion||[]).join(',');
    $('fShopee').value = p.shopeeUrl || '';
    $('fFeatured').checked = !!p.featured;
    $('fTrending').checked = !!p.trending;
    $('fDesc').value = p.description || '';
    $('fCare').value = p.careInstructions || '';
    $('fSizes').value = JSON.stringify(p.sizes||[], null, 2);
    $('fTips').value = (p.stylingTips||[]).join('\n');
    $('fPhotos').value = JSON.stringify(p.photos||[], null, 2);
  };

  const closeEditor = ()=>{ $('editor').style.display = 'none'; state.editIndex=-1; };

  const readForm = () => {
    let sizes=[], photos=[], tips=[], occ=[];
    try { sizes = JSON.parse($('fSizes').value||'[]'); } catch(e){ alert('Sizes bukan JSON valid'); throw e; }
    try { photos = JSON.parse($('fPhotos').value||'[]'); } catch(e){ alert('Photos bukan JSON valid'); throw e; }
    tips = ($('fTips').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
    occ  = ($('fOccasion').value||'').split(',').map(s=>s.trim()).filter(Boolean);

    return {
      name: $('fName').value.trim(),
      price: Number($('fPrice').value||0),
      style: $('fStyle').value,
      material: $('fMaterial').value.trim(),
      thickness: $('fThickness').value,
      occasion: occ,
      description: $('fDesc').value.trim(),
      careInstructions: $('fCare').value.trim(),
      shopeeUrl: $('fShopee').value.trim(),
      featured: $('fFeatured').checked,
      trending: $('fTrending').checked,
      sizes, stylingTips: tips, photos
    };
  };

  // Handlers
  $('openBtn').onclick = ()=> $('openFile').click();
  $('openFile').addEventListener('change', async (e)=>{
    const file = e.target.files?.[0];
    if (!file) return;
    try{
      const text = await file.text();
      const json = JSON.parse(text);
      state.list = Array.isArray(json) ? json : (json.products || []);
      render();
    }catch(err){ alert('File JSON tidak valid'); }
  });

  $('addBtn').onclick = ()=>{
    openEditor({
      name:'', price:0, style:'classic', material:'Cotton Blend', thickness:'medium',
      occasion:[], description:'', careInstructions:'', shopeeUrl:'',
      featured:false, trending:false,
      sizes:[{"size":"All Size","bust":"84-106","length":"58-64","available":true,"stock":0,"note":""}],
      stylingTips:[''], photos:[{"url":"","label":"Tampak Depan"}]
    }, -1);
  };

  $('tableBody').addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    const idx = Number(btn.dataset.idx);
    const data = state.filtered.length ? state.filtered : state.list;
    const item = data[idx];
    const realIndex = state.list.indexOf(item);

    if (act==='edit') {
      openEditor(item, realIndex);
    } else if (act==='del') {
      if (!confirm('Hapus produk #' + (item.id ?? '') + ' ?')) return;
      state.list.splice(realIndex,1);
      render();
    }
  });

  $('saveEdit').onclick = ()=>{
    try{
      const body = readForm();
      if (!body.name) return alert('Nama wajib diisi');

      // assign id
      if (state.editIndex === -1) {
        body.id = Date.now();
        state.list.push(body);
      } else {
        state.list[state.editIndex] = { ...state.list[state.editIndex], ...body };
      }
      closeEditor();
      render();
    }catch(e){}
  };
  $('cancelEdit').onclick = closeEditor;

  $('sizesEx').onclick = ()=>{
    $('fSizes').value = JSON.stringify(
      [{"size":"All Size","bust":"84-106","length":"58-64","available":true,"stock":10,"note":"Fit nyaman"}],
      null,2
    );
  };
  $('photosEx').onclick = ()=>{
    $('fPhotos').value = JSON.stringify(
      [{"url":"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'><rect width='300' height='400' fill='%23fdf2f8'/></svg>","label":"Tampak Depan"}],
      null,2
    );
  };

  $('search').addEventListener('input', (e)=>{
    const q = e.target.value.toLowerCase().trim();
    if (!q) { state.filtered = []; return render(); }
    state.filtered = state.list.filter(p =>
      (p.name||'').toLowerCase().includes(q) ||
      (p.material||'').toLowerCase().includes(q) ||
      (p.style||'').toLowerCase().includes(q)
    );
    render();
  });

  $('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state.list, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'products.json';
    a.click();
    URL.revokeObjectURL(a.href);
    alert('Terunduh products.json — ganti file di data/products.json proyekmu');
  };

  // first render
  render();
})();
</script>
</body>
</html>
