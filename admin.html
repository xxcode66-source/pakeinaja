<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - PAKEINAJA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pinkCute: '#f9a8d4',
            pinkSoft: '#fce7f3',
            pinkDark: '#db2777',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .hidden-admin { display: none !important; }
  </style>
</head>
<body class="bg-pinkSoft/40 min-h-screen">

  <!-- ========== LOGIN TOKEN ========== -->
  <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-lg p-8 w-full max-w-sm">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-pinkCute/30 rounded-full flex items-center justify-center mx-auto mb-3">
          <i class="fa-solid fa-lock text-pinkDark text-xl"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-800">Admin PAKEINAJA</h1>
        <p class="text-sm text-gray-400 mt-1">Masukkan token admin untuk masuk</p>
      </div>
      <input id="tokenInput" type="password" placeholder="Admin Token"
        class="w-full border border-pinkSoft rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-pinkCute mb-3">
      <button onclick="doLogin()" class="w-full bg-pinkDark text-white font-semibold py-3 rounded-xl hover:bg-pink-700 transition text-sm">
        Masuk
      </button>
      <p id="loginError" class="text-xs text-red-500 mt-3 text-center hidden"></p>
    </div>
  </div>

  <!-- ========== DASHBOARD ========== -->
  <div id="dashView" class="hidden-admin">
    <header class="bg-white border-b border-pinkSoft sticky top-0 z-40">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-shirt text-pinkDark text-xl"></i>
          <span class="font-bold text-gray-800">PAKEINAJA <span class="text-xs font-medium text-gray-400">admin</span></span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="doBackup()" class="text-xs bg-pinkSoft hover:bg-pinkCute hover:text-white text-pinkDark px-3 py-1.5 rounded-full font-semibold transition"><i class="fa-solid fa-download"></i> Backup</button>
          <a href="/" class="text-xs text-gray-500 hover:text-pinkDark"><i class="fa-solid fa-store"></i> Lihat Toko</a>
          <button onclick="doLogout()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-full">Keluar</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

      <!-- Statistik -->
      <section class="grid grid-cols-3 gap-3">
        <div class="bg-white rounded-2xl p-4 border border-pinkSoft shadow-sm text-center">
          <p class="text-[11px] text-gray-400 uppercase tracking-wide">Tersedia</p>
          <p id="statActive" class="text-2xl font-bold text-gray-800">0</p>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-pinkSoft shadow-sm text-center">
          <p class="text-[11px] text-gray-400 uppercase tracking-wide">Kejual</p>
          <p id="statSold" class="text-2xl font-bold text-green-600">0</p>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-pinkSoft shadow-sm text-center">
          <p class="text-[11px] text-gray-400 uppercase tracking-wide">Total Omzet</p>
          <p id="statRevenue" class="text-2xl font-bold text-pinkDark">Rp 0</p>
        </div>
      </section>

      <!-- Form tambah / edit barang -->
      <section class="bg-white rounded-3xl p-5 border border-pinkSoft shadow-sm">
        <h2 id="formTitle" class="font-bold text-gray-800 mb-4"><i class="fa-solid fa-plus text-pinkDark mr-1"></i> Tambah Barang</h2>
        <input type="hidden" id="editId">
        <div class="grid md:grid-cols-2 gap-3">
          <div class="md:col-span-2 flex items-center gap-2">
            <span class="text-xs text-gray-500">Tipe:</span>
            <div class="inline-flex rounded-xl border border-pinkSoft overflow-hidden text-sm">
              <button type="button" id="typeSingle" onclick="setType('single')" class="px-4 py-1.5 font-semibold bg-pinkDark text-white">Satuan</button>
              <button type="button" id="typeBundle" onclick="setType('bundle')" class="px-4 py-1.5 font-semibold bg-white text-gray-500">Bundle 🎁</button>
            </div>
          </div>
          <div id="bundleEditor" class="md:col-span-2 hidden">
            <div class="flex items-center justify-between mb-2">
              <label class="text-xs text-gray-500">Isi Bundle (maks 20 · item terakhir = 🎁 bonus)</label>
              <button type="button" onclick="addBundleItem()" class="text-xs bg-pinkSoft text-pinkDark font-semibold px-3 py-1 rounded-lg hover:bg-pinkCute hover:text-white transition"><i class="fa-solid fa-plus"></i> Tambah Item</button>
            </div>
            <div id="bundleList" class="space-y-2"></div>
            <p id="bundleUploadStatus" class="text-xs text-gray-400 mt-1 hidden"></p>
          </div>
          <div>
            <label class="text-xs text-gray-500">Nama barang *</label>
            <input id="fName" class="w-full border border-pinkSoft rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pinkCute" placeholder="Misal: Cardigan Rajut Peach">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="flex gap-2">
              <div class="flex-1">
                <label class="text-xs text-gray-500">Harga (Rp) *</label>
                <input id="fPrice" type="number" min="0" class="w-full border border-pinkSoft rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pinkCute" placeholder="35000">
              </div>
              <div class="flex-1">
                <label class="text-xs text-gray-500">Harga coret (opsional)</label>
                <input id="fPriceOld" type="number" min="0" class="w-full border border-pinkSoft rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pinkCute" placeholder="60000">
              </div>
            </div>
            <div>
              <label class="text-xs text-gray-500">Badge</label>
              <select id="fBadge" class="w-full border border-pinkSoft rounded-xl px-3 py-2 text-sm bg-white">
                <option value="">— tidak ada —</option>
                <option>BARU</option>
                <option>BEST SELLER</option>
                <option>PREMI</option>
              </select>
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500">Video (opsional, URL)</label>
            <input id="fVideo" class="w-full border border-pinkSoft rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pinkCute" placeholder="https://... .mp4">
          </div>
          <div class="md:col-span-2">
            <label class="text-xs text-gray-500">Deskripsi</label>
            <textarea id="fDesc" rows="2" class="w-full border border-pinkSoft rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pinkCute" placeholder="Deskripsi (otomatis terisi — silakan sesuaikan)"></textarea>
          </div>
          <div class="md:col-span-2" id="singleImageBlock">
            <label class="text-xs text-gray-500">Foto-foto (maks 8, @8MB)</label>
            <input id="fImages" type="file" accept="image/*" multiple class="w-full text-sm file:bg-pinkSoft file:text-pinkDark file:border-0 file:rounded-xl file:px-4 file:py-2 file:mr-3 file:cursor-pointer">
            <div id="imgPreview" class="flex flex-wrap gap-2 mt-3"></div>
            <p id="uploadStatus" class="text-xs text-gray-400 mt-1 hidden"></p>
          </div>
        </div>
        <div class="flex gap-2 mt-5">
          <button id="btnSave" onclick="saveProduct()" class="bg-pinkDark text-white text-sm font-semibold px-6 py-2.5 rounded-xl hover:bg-pink-700 transition">
            <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan
          </button>
          <button onclick="resetForm()" class="text-sm text-gray-500 bg-gray-100 hover:bg-gray-200 px-4 py-2.5 rounded-xl">Batal / Reset</button>
        </div>
      </section>

      <!-- Daftar barang aktif -->
      <section class="bg-white rounded-3xl p-5 border border-pinkSoft shadow-sm">
        <h2 class="font-bold text-gray-800 mb-4"><i class="fa-solid fa-boxes-stacked text-pinkDark mr-1"></i> Barang Dijual <span id="listCount" class="text-xs font-medium text-gray-400"></span></h2>
        <div id="productList" class="space-y-3">
          <p class="text-sm text-gray-400">Memuat...</p>
        </div>
      </section>

      <!-- Riwayat terjual -->
      <section class="bg-white rounded-3xl p-5 border border-pinkSoft shadow-sm">
        <button onclick="toggleHistory()" class="w-full flex items-center justify-between">
          <h2 class="font-bold text-gray-800"><i class="fa-solid fa-chart-line text-green-600 mr-1"></i> Riwayat Terjual</h2>
          <i id="histChevron" class="fa-solid fa-chevron-down text-gray-400 text-sm transition"></i>
        </button>
        <div id="histBody" class="hidden mt-4">
          <div class="flex items-center justify-between mb-2">
            <p class="text-xs text-gray-400">Total kejual: <b id="histCount" class="text-green-600">0</b> · Omzet: <b id="histRevenue" class="text-pinkDark">Rp 0</b></p>
            <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-600">Hapus riwayat (reset hitungan)</button>
          </div>
          <div id="histList" class="space-y-1.5 max-h-72 overflow-y-auto"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-5 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition z-50"></div>

  <!-- Modal konfirmasi -->
  <div id="confirmModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl" onclick="event.stopPropagation()">
      <div id="cmIcon" class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 bg-green-100">
        <i class="fa-solid fa-check text-green-600 text-2xl"></i>
      </div>
      <h3 id="cmTitle" class="text-lg font-bold text-gray-800 text-center">Konfirmasi</h3>
      <p id="cmBody" class="text-sm text-gray-500 text-center mt-2 leading-relaxed"></p>
      <div class="flex gap-2 mt-6">
        <button id="cmCancel" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-semibold py-2.5 rounded-xl transition">Batal</button>
        <button id="cmOk" class="flex-1 text-sm font-semibold py-2.5 rounded-xl transition text-white bg-green-600 hover:bg-green-700">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <script>
    const API = '/api';
    let TOKEN_KEY = 'pakein_admin_token';
    let token = localStorage.getItem(TOKEN_KEY) || '';
    let allProducts = [];
    let currentStats = { soldCount: 0, revenue: 0, soldHistory: [] };
    let pendingImages = []; // { url, name }
    let bundleItems = [];   // { name, image } — khusus tipe bundle
    let currentType = 'single';
    const PAGE_SIZE = 10;
    let prodPage = 1;
    let histPage = 1;

    const $ = id => document.getElementById(id);
    const rupiah = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
    const authHeaders = () => ({ 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' });

    function toast(msg, ok = true) {
      const t = $('toast');
      t.textContent = msg;
      t.style.background = ok ? '' : '#dc2626';
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 2500);
    }

    // ---------- Modal konfirmasi ----------
    function confirmAction({ title, body, okText = 'Ya, Lanjutkan', danger = false, icon = 'fa-check' }) {
      return new Promise(resolve => {
        $('cmTitle').textContent = title;
        $('cmBody').innerHTML = body;
        const okBtn = $('cmOk');
        okBtn.textContent = okText;
        okBtn.className = 'flex-1 text-sm font-semibold py-2.5 rounded-xl transition text-white ' + (danger ? 'bg-red-500 hover:bg-red-600' : 'bg-green-600 hover:bg-green-700');
        $('cmIcon').className = 'w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 ' + (danger ? 'bg-red-50' : 'bg-green-100');
        $('cmIcon').innerHTML = `<i class="fa-solid ${icon} ${danger ? 'text-red-500' : 'text-green-600'} text-2xl"></i>`;
        const modal = $('confirmModal');
        modal.classList.remove('hidden');
        const close = (val) => {
          modal.classList.add('hidden');
          $('cmOk').onclick = $('cmCancel').onclick = modal.onclick = null;
          resolve(val);
        };
        $('cmOk').onclick = () => close(true);
        $('cmCancel').onclick = () => close(false);
        modal.onclick = (e) => { if (e.target === modal) close(false); };
      });
    }

    // ---------- Auth ----------
    async function doLogin() {
      token = $('tokenInput').value.trim();
      if (!token) return;
      const ok = await loadAll();
      if (ok) {
        localStorage.setItem(TOKEN_KEY, token);
        showDash();
      } else {
        $('loginError').textContent = 'Token salah / server tidak reachable';
        $('loginError').classList.remove('hidden');
        token = '';
      }
    }

    function doLogout() {
      localStorage.removeItem(TOKEN_KEY);
      token = '';
      $('loginView').classList.remove('hidden');
      $('dashView').classList.add('hidden-admin');
    }

    function showDash() {
      $('loginView').classList.add('hidden');
      $('dashView').classList.remove('hidden-admin');
      resetForm(); // inialisasi form (termasuk deskripsi default) saat dashboard dibuka
    }

    // ---------- Backup / Export ----------
    async function doBackup() {
      try {
        const res = await fetch(`${API}/admin/export`, { headers: { 'Authorization': 'Bearer ' + token }, cache: 'no-store' });
        if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || 'Gagal membuat backup'); }
        const data = await res.json();
        const stamp = String(data.exportedAt || new Date().toISOString()).slice(0, 10);
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `pakeinaja-backup-${stamp}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        toast(`Backup ${data.products?.length ?? 0} barang terunduh ✓`);
      } catch (err) {
        toast(err.message || 'Backup gagal', false);
      }
    }

    // ---------- Data ----------
    async function loadAll() {
      try {
        const res = await fetch(`${API}/admin/products`, { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) return false;
        const result = await res.json();
        if (!result.success) return false;
        allProducts = result.products || [];
        currentStats = result.stats || currentStats;
        histPage = 1;
        renderAll();
        return true;
      } catch (e) {
        return false;
      }
    }

    function renderAll() {
      $('statActive').textContent = allProducts.length;
      $('statSold').textContent = currentStats.soldCount || 0;
      $('statRevenue').textContent = rupiah(currentStats.revenue);
      $('histCount').textContent = currentStats.soldCount || 0;
      $('histRevenue').textContent = rupiah(currentStats.revenue);
      $('listCount').textContent = `(${allProducts.length})`;

      // --- daftar barang (pagination per 10) ---
      const totalProdPages = Math.max(1, Math.ceil(allProducts.length / PAGE_SIZE));
      prodPage = Math.min(prodPage, totalProdPages);
      const start = (prodPage - 1) * PAGE_SIZE;
      const pageItems = allProducts.slice(start, start + PAGE_SIZE);
      $('productList').innerHTML = allProducts.length === 0
        ? '<p class="text-sm text-gray-400">Belum ada barang. Tambah di form atas ya.</p>'
        : pageItems.map((p, i) => `
          <div class="flex items-center gap-3 border border-pinkSoft/60 rounded-2xl p-2.5 hover:border-pinkCute transition bg-white">
            <img src="${(p.images && p.images[0]) || ''}" onerror="this.style.visibility='hidden'" class="w-14 h-14 rounded-xl object-cover bg-pinkSoft/30 flex-shrink-0">
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-sm text-gray-800 truncate">${p.name}</p>
              <p class="text-xs text-gray-400">${p.type === 'bundle' ? '<span class="text-amber-600 font-bold">🎁 BUNDLE · ' + (p.bundleItems ? p.bundleItems.length : 0) + ' item</span> ' : ''}${p.badge ? '<span class="text-pinkDark font-medium">' + p.badge + '</span>' : ''}</p>
              <p class="text-sm font-bold text-pinkDark">${rupiah(p.price)}${p.priceOld > p.price ? ' <span class="text-[10px] font-medium text-gray-400 line-through">' + rupiah(p.priceOld) + '</span>' : ''}</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-1.5 flex-shrink-0">
              <button onclick="markSold(${p.id})" class="text-xs bg-green-500 hover:bg-green-600 text-white font-semibold px-3 py-1.5 rounded-lg"><i class="fa-solid fa-check"></i> Terjual</button>
              <button onclick="editProduct(${p.id})" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg">Edit</button>
              <button onclick="deleteProduct(${p.id})" class="text-xs bg-red-50 hover:text-red-600 text-red-500 px-3 py-1.5 rounded-lg">Hapus</button>
            </div>
          </div>
        `).join('') + pagerHtml(start, allProducts.length, prodPage, totalProdPages, 'goProdPage');

      // --- riwayat terjual (pagination per 10, tampilan kartu harian) ---
      const hist = currentStats.soldHistory || [];
      const totalHistPages = Math.max(1, Math.ceil(hist.length / PAGE_SIZE));
      histPage = Math.min(histPage, totalHistPages);
      const hStart = (histPage - 1) * PAGE_SIZE;
      $('histList').innerHTML = hist.length === 0
        ? '<p class="text-sm text-gray-400">Belum ada yang terjual.</p>'
        : `<div class="space-y-2">` + hist.slice(hStart, hStart + PAGE_SIZE).map((h, i) => {
            const d = new Date(h.soldAt);
            return `
          <div class="flex items-center gap-3 bg-pinkSoft/20 hover:bg-pinkSoft/40 transition border border-pinkSoft/50 rounded-xl px-3 py-2.5">
            <div class="w-9 h-9 rounded-xl bg-white border border-pinkSoft flex flex-col items-center justify-center flex-shrink-0">
              <span class="text-[11px] font-bold text-pinkDark leading-none">${d.toLocaleDateString('id-ID', { day: '2-digit' })}</span>
              <span class="text-[8px] text-gray-400 uppercase leading-none mt-0.5">${d.toLocaleDateString('id-ID', { month: 'short' })}</span>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold text-gray-700 truncate">${h.name}</p>
              <p class="text-[10px] text-gray-400">${d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} · ${d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</p>
            </div>
            <span class="text-xs font-bold text-green-600 bg-green-50 border border-green-100 px-2.5 py-1 rounded-full flex-shrink-0">+${rupiah(h.price)}</span>
          </div>`;
          }).join('') + `</div>` + pagerHtml(hStart, hist.length, histPage, totalHistPages, 'goHistPage');
    }

    // Helper pagination: nomor halaman + tombol prev/next
    function pagerHtml(shownCount, total, page, totalPages, fn) {
      if (total <= PAGE_SIZE) return '';
      const btn = (n, label = n, active = false, disabled = false) =>
        `<button ${disabled ? 'disabled' : `onclick="${fn}(${n})"`} class="min-w-[30px] h-[30px] px-1.5 rounded-lg text-xs font-semibold transition ${
          active ? 'bg-pinkDark text-white shadow' : disabled ? 'text-gray-300 cursor-not-allowed' : 'bg-white border border-pinkSoft text-gray-500 hover:border-pinkCute hover:text-pinkDark'
        }">${label}</button>`;
      const nums = [];
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || Math.abs(i - page) <= 1) nums.push(i);
        else if (nums[nums.length - 1] !== '…') nums.push('…');
      }
      return `
        <div class="flex items-center justify-between mt-4 pt-3 border-t border-pinkSoft/50">
          <p class="text-[11px] text-gray-400">Halaman ${page} / ${totalPages} · total ${total}</p>
          <div class="flex items-center gap-1.5">
            ${btn(page - 1, '<i class="fa-solid fa-chevron-left"></i>', false, page === 1)}
            ${nums.map(n => n === '…' ? '<span class="text-xs text-gray-400 px-0.5">…</span>' : btn(n, n, n === page)).join('')}
            ${btn(page + 1, '<i class="fa-solid fa-chevron-right"></i>', false, page === totalPages)}
          </div>
        </div>`;
    }
    function goProdPage(n) { prodPage = n; renderAll(); $('productList').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    function goHistPage(n) { histPage = n; renderAll(); }

    // ---------- Upload gambar (kompres otomatis di browser) ----------
    // Resize maks 1200px + JPEG ~82% → loading cepat & kuota Blob awet.
    // GIF & file yang sudah kecil dilewatkan apa adanya.
    async function compressImage(file, maxDim = 1200, quality = 0.82) {
      if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
      try {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
        if (scale === 1 && file.size < 1.5 * 1024 * 1024) return file;
        const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
        return blob && blob.size < file.size
          ? new File([blob], file.name.replace(/\.\w+$/, '.jpg'), { type: 'image/jpeg' })
          : file;
      } catch (e) {
        return file; //kalau gagal proses, upload original aja
      }
    }

    let uploadingCount = 0;
    function refreshSaveBtn() {
      const btn = $('btnSave');
      btn.disabled = uploadingCount > 0;
      btn.classList.toggle('opacity-50', uploadingCount > 0);
      btn.classList.toggle('cursor-not-allowed', uploadingCount > 0);
    }

    async function uploadFiles(fileList) {
      const status = $('uploadStatus');
      for (const file of fileList) {
        if (pendingImages.length >= 8) { toast('Maks 8 foto', false); break; }
        status.classList.remove('hidden');
        status.textContent = `Mengoptimalkan & upload ${file.name} (${uploadingCount + 1}/${fileList.length})...`;
        uploadingCount++; refreshSaveBtn();
        const payload = await compressImage(file);
        try {
          const res = await fetch(`${API}/admin/upload`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'x-filename': payload.name, 'Content-Type': payload.type || 'application/octet-stream' },
            body: payload,
          });
          const result = await res.json();
          if (result.success) {
            pendingImages.push({ url: result.url, name: file.name });
          } else {
            toast(`${file.name}: ${result.error || 'gagal'}`, false);
          }
        } catch (e) {
          toast(`${file.name}: gagal upload`, false);
        } finally {
          uploadingCount--; refreshSaveBtn();
        }
      }
      status.classList.add('hidden');
      renderImgPreviews();
      if (pendingImages.length) toast(`${pendingImages.length} foto siap ✓`);
    }

    function renderImgPreviews() {
      $('imgPreview').innerHTML = pendingImages.map((img, i) => `
        <div class="relative">
          <img src="${img.url}" class="w-16 h-16 rounded-xl object-cover border border-pinkSoft">
          <button onclick="removeImage(${i})" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-[10px]"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');
    }

    function removeImage(i) {
      // Kalau URL blob lama (dari produk yang diedit), hapus dari daftar; server yang membersihkan blob-nya saat simpan
      pendingImages.splice(i, 1);
      renderImgPreviews();
    }

    // ---------- Bundle ----------
    function setType(t) {
      currentType = t;
      const isBundle = t === 'bundle';
      $('typeSingle').className = 'px-4 py-1.5 font-semibold ' + (isBundle ? 'bg-white text-gray-500' : 'bg-pinkDark text-white');
      $('typeBundle').className = 'px-4 py-1.5 font-semibold ' + (isBundle ? 'bg-pinkDark text-white' : 'bg-white text-gray-500');
      $('bundleEditor').classList.toggle('hidden', !isBundle);
      $('singleImageBlock').classList.toggle('hidden', isBundle);
    }
    function addBundleItem() {
      if (bundleItems.length >= 20) return toast('Maksimal 20 item', false);
      bundleItems.push({ name: '', image: '' });
      renderBundleItems();
    }
    function removeBundleItem(i) { bundleItems.splice(i, 1); renderBundleItems(); }
    function setBundleName(i, v) { if (bundleItems[i]) bundleItems[i].name = v; }
    async function uploadBundleImage(i, input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file || !bundleItems[i]) return;
      const status = $('bundleUploadStatus');
      status.classList.remove('hidden'); status.textContent = 'Mengupload foto item...';
      uploadingCount++; refreshSaveBtn();
      const payload = await compressImage(file);
      try {
        const res = await fetch(`${API}/admin/upload`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'x-filename': payload.name, 'Content-Type': payload.type || 'application/octet-stream' },
          body: payload,
        });
        const result = await res.json();
        if (result.success) { bundleItems[i].image = result.url; renderBundleItems(); }
        else toast(result.error || 'Gagal upload', false);
      } catch (e) {
        toast('Gagal upload foto item', false);
      } finally {
        uploadingCount--; refreshSaveBtn(); status.classList.add('hidden');
      }
    }
    function renderBundleItems() {
      const last = bundleItems.length - 1;
      $('bundleList').innerHTML = bundleItems.length === 0
        ? '<p class="text-xs text-gray-400">Belum ada item. Klik "Tambah Item" untuk mulai.</p>'
        : bundleItems.map((it, i) => `
          <div class="flex items-center gap-2 border border-pinkSoft/60 rounded-xl p-2 bg-white">
            <span class="w-5 text-center text-xs font-bold text-gray-400 flex-shrink-0">${i + 1}</span>
            <label class="w-12 h-12 rounded-lg bg-pinkSoft/30 border border-pinkSoft flex items-center justify-center cursor-pointer flex-shrink-0 overflow-hidden">
              ${it.image ? `<img src="${it.image}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-camera text-pinkDark"></i>'}
              <input type="file" accept="image/*" class="hidden" onchange="uploadBundleImage(${i}, this)">
            </label>
            <input value="${(it.name || '').replace(/"/g, '&quot;')}" oninput="setBundleName(${i}, this.value)" placeholder="Nama item ${i + 1}" class="flex-1 min-w-0 border border-pinkSoft rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-pinkCute">
            ${i === last && bundleItems.length >= 2 ? '<span class="text-[10px] font-bold text-amber-600 bg-amber-50 border border-amber-200 px-2 py-1 rounded-full flex-shrink-0">🎁 BONUS</span>' : ''}
            <button type="button" onclick="removeBundleItem(${i})" class="w-7 h-7 text-red-400 hover:text-red-600 flex-shrink-0"><i class="fa-solid fa-trash"></i></button>
          </div>
        `).join('');
    }

    // ---------- CRUD ----------
    async function saveProduct() {
      if (uploadingCount > 0) return toast('Tunggu sebentar, foto masih diupload...', false);
      const name = $('fName').value.trim();
      const price = Number($('fPrice').value);
      if (!name) return toast('Nama barang wajib diisi', false);
      if (!price) return toast('Harga wajib diisi', false);

      const editId = $('editId').value;
      if (currentType === 'bundle' && bundleItems.filter(it => it.image).length < 2) {
        return toast('Bundle butuh minimal 2 item (masing-masing ada foto)', false);
      }
      const payload = {
        name, price,
        priceOld: Number($('fPriceOld').value) || null,
        description: $('fDesc').value.trim(),
        badge: $('fBadge').value,
        video: currentType === 'bundle' ? null : ($('fVideo').value.trim() || null),
        type: currentType,
        images: pendingImages.map(i => i.url),
        bundleItems: currentType === 'bundle' ? bundleItems.filter(it => it.image) : [],
      };
      // kalau edit, bersih-bersih field lama yang sudah tidak dipakai (misal material)
      if (editId) {
        const old = allProducts.find(x => String(x.id) === editId) || {};
        Object.keys(old).forEach(k => { if (!(k in payload) && !['id', 'createdAt', 'rating'].includes(k)) payload[k] = null; });
      }
      $('btnSave').disabled = true;
      try {
        const url = editId ? `${API}/admin/products/${editId}` : `${API}/admin/products`;
        const res = await fetch(url, { method: editId ? 'PATCH' : 'POST', headers: authHeaders(), body: JSON.stringify(payload) });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || 'Gagal menyimpan');
        toast(editId ? 'Barang diperbarui ✓' : 'Barang ditambahkan ✓');
        resetForm();
        await loadAll();
      } catch (e) {
        toast(e.message, false);
      } finally {
        $('btnSave').disabled = false;
      }
    }

    function editProduct(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;
      $('editId').value = p.id;
      $('fName').value = p.name || '';
      $('fPrice').value = p.price || '';
      $('fPriceOld').value = p.priceOld || '';
      $('fDesc').value = p.description || '';
      $('fBadge').value = p.badge || '';
      $('fVideo').value = p.video || '';
      pendingImages = (p.images || []).map(u => ({ url: u, name: u.split('/').pop() }));
      renderImgPreviews();
      currentType = p.type === 'bundle' ? 'bundle' : 'single';
      setType(currentType);
      bundleItems = (p.bundleItems || []).map(it => ({ name: it.name || '', image: it.image || '' }));
      renderBundleItems();
      $('formTitle').innerHTML = '<i class="fa-solid fa-pen text-pinkDark mr-1"></i> Edit Barang';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      // Deskripsi default global (bisa diedit), biar ga perlu ngetik manual tiap nambah barang
      const DEFAULT_DESC = 'Barang sesuai foto. Warna pada gambar mungkin sedikit berbeda dengan aslinya karena pencahayaan saat foto, tapi kurang lebih seperti di gambar ya 🌸';
      $('editId').value = '';
      ['fName', 'fPrice', 'fPriceOld', 'fVideo'].forEach(id => $(id).value = '');
      $('fDesc').value = DEFAULT_DESC;
      $('fBadge').value = '';
      $('fImages').value = '';
      pendingImages = [];
      renderImgPreviews();
      currentType = 'single';
      setType('single');
      bundleItems = [];
      renderBundleItems();
      $('formTitle').innerHTML = '<i class="fa-solid fa-plus text-pinkDark mr-1"></i> Tambah Barang';
    }

    async function markSold(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;
      const ok = await confirmAction({
        title: 'Tandai Terjual?',
        body: `<b>"${p.name}"</b> akan hilang dari etalase, hitungan kejual +1, dan omzet bertambah <b class="text-green-600">${rupiah(p.price)}</b>.`,
        okText: 'Ya, Terjual', danger: false, icon: 'fa-check',
      });
      if (!ok) return;
      try {
        const res = await fetch(`${API}/admin/sell`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ id }) });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || 'Gagal');
        toast('Alhamdulillah, tercatat terjual ✓');
        await loadAll();
      } catch (e) {
        toast(e.message, false);
      }
    }

    async function deleteProduct(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;
      const ok = await confirmAction({
        title: 'Hapus Barang?',
        body: `<b>"${p.name}"</b> dihapus permanen <b>tanpa</b> tercatat terjual. Gambar & video ikut terhapus dari penyimpanan.`,
        okText: 'Hapus', danger: true, icon: 'fa-trash',
      });
      if (!ok) return;
      try {
        const res = await fetch(`${API}/admin/products/${id}`, { method: 'DELETE', headers: authHeaders() });
        const result = await res.json().catch(() => ({ success: false, error: 'Respons server tidak valid' }));
        if (!result.success) throw new Error(result.error || 'Gagal');
        toast('Barang dihapus');
        await loadAll();
      } catch (e) {
        toast(e.message, false);
      }
    }

    // ---------- Riwayat ----------
    function toggleHistory() {
      $('histBody').classList.toggle('hidden');
      $('histChevron').classList.toggle('rotate-180');
    }

    async function clearHistory() {
      const ok = await confirmAction({
        title: 'Reset Riwayat & Hitungan?',
        body: 'PENTING: Hitungan kejual & omzet kembali ke <b class="text-red-500">NOL</b> dan riwayat dikosongkan. Data barang aktif tidak terpengaruh.',
        okText: 'Reset', danger: true, icon: 'fa-rotate-left',
      });
      if (!ok) return;
      // Simpan ulang via endpoint khusus? Tidak ada — reuse sell pattern tidak cocok.
      // Solusi ringan: kirimi PATCH katalog via /api/admin/stats
      try {
        const res = await fetch(`${API}/admin/stats`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ reset: true }) });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || 'Gagal');
        toast('Riwayat & hitungan direset');
        await loadAll();
      } catch (e) {
        toast(e.message, false);
      }
    }

    // ---------- Init ----------
    $('fImages').addEventListener('change', e => {
      if (e.target.files.length) uploadFiles([...e.target.files]);
      e.target.value = '';
    });
    $('tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    (async function init() {
      if (token && await loadAll()) showDash();
    })();
  </script>
</body>
</html>
